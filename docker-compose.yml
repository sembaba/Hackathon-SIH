version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: verticad_postgis
    environment:
      POSTGRES_DB: verticad_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verticad_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: verticad_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=production-secret-key-verticad-2026-3d-ulpin
      - POSTGRES_DB=verticad_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_password_2026
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: verticad_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_CESIUM_ION_TOKEN=YOUR_CESIUM_ION_TOKEN_HERE
    depends_on:
      - backend

volumes:
  postgis_data:
