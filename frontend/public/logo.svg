<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="100" height="100" rx="20" fill="url(#primaryGrad)" />
  
  <!-- Isometric 3D Property Stack -->
  <!-- Ground 2D Parcel footprint -->
  <polygon points="50,78 82,62 50,46 18,62" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 2"/>
  
  <!-- Lower Floor -->
  <polygon points="50,68 76,55 50,42 24,55" fill="url(#floorGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  
  <!-- Middle Floor -->
  <polygon points="50,55 76,42 50,29 24,42" fill="url(#floorGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  
  <!-- Top Floor / 3D Unit Highlight -->
  <polygon points="50,42 76,29 50,16 24,29" fill="url(#accentGrad)" stroke="#67e8f9" stroke-width="2"/>
  
  <!-- Vertical Z-axis coordinate pillar -->
  <line x1="50" y1="14" x2="50" y2="82" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Central Glowing Coordinate Node -->
  <circle cx="50" cy="29" r="4" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>
</svg>
